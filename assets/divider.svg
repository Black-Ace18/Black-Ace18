<?xml version="1.0" encoding="UTF-8"?>
<svg
xmlns="http://www.w3.org/2000/svg"
width="1280"
height="60"
viewBox="0 0 1280 60">

<defs>

<linearGradient id="line" x1="0%" y1="50%" x2="100%" y2="50%">
<stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
<stop offset="50%" stop-color="#00E5FF"/>
<stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<radialGradient id="core">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#00E5FF"/>
</radialGradient>

</defs>

<!-- Main glowing line -->

<line
x1="70"
y1="30"
x2="1210"
y2="30"
stroke="url(#line)"
stroke-width="2"
filter="url(#glow)">

<animate
attributeName="opacity"
values=".45;1;.45"
dur="3s"
repeatCount="indefinite"/>

</line>

<!-- Center energy core -->

<circle
cx="640"
cy="30"
r="6"
fill="url(#core)"
filter="url(#glow)">

<animate
attributeName="r"
values="5;8;5"
dur="2s"
repeatCount="indefinite"/>

</circle>

<!-- Left pulse -->

<circle
cx="640"
cy="30"
r="12"
fill="none"
stroke="#00E5FF"
stroke-width="1"
opacity=".5">

<animate
attributeName="r"
values="12;40"
dur="2s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".5;0"
dur="2s"
repeatCount="indefinite"/>

</circle>

<!-- Right pulse -->

<circle
cx="640"
cy="30"
r="12"
fill="none"
stroke="#00E5FF"
stroke-width="1"
opacity=".5"
begin="1s">

<animate
attributeName="r"
values="12;40"
dur="2s"
repeatCount="indefinite"/>

<animate
attributeName="opacity"
values=".5;0"
dur="2s"
repeatCount="indefinite"/>

</circle>

<!-- Energy particle -->

<circle
cx="70"
cy="30"
r="2.5"
fill="#00E5FF"
filter="url(#glow)">

<animate
attributeName="cx"
values="70;1210"
dur="4s"
repeatCount="indefinite"/>

</circle>

<!-- Reverse particle -->

<circle
cx="1210"
cy="30"
r="2"
fill="#7DF9FF"
filter="url(#glow)">

<animate
attributeName="cx"
values="1210;70"
dur="6s"
repeatCount="indefinite"/>

</circle>

<!-- Tiny stars -->

<circle cx="250" cy="30" r="1" fill="#00E5FF">
<animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="450" cy="30" r="1" fill="#00E5FF">
<animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
</circle>

<circle cx="830" cy="30" r="1" fill="#00E5FF">
<animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="30" r="1" fill="#00E5FF">
<animate attributeName="opacity" values="1;.3;1" dur="3.5s" repeatCount="indefinite"/>
</circle>

</svg>
